version: '3.9'

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  app-releases:
  sfu-recordings:
  api-videofiles:   # permanent files  → /app/VideoFiles
  api-temp:         # temp + uploads   → /app/Temp  (includes room-uploads/)

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── mediasoup SFU ────────────────────────────────────────────────────────────
  sfu:
    build:
      context: ./sfu
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SFU_HTTP_PORT: "3000"
      # The API reaches the SFU by service name, so the control API listens on the container's network
      # interface. It is still private: the port is not published below.
      SFU_HTTP_BIND: "0.0.0.0"
      # Public address announced in ICE candidates. Override to 127.0.0.1 only for same-machine local testing.
      SFU_ANNOUNCED_IP: "${SFU_ANNOUNCED_IP:-152.53.224.14}"
      # Each worker serves all of its browser transports on one port: 10000 for the first worker, 10001 for a
      # second, and so on. The rest of the range is used internally for file streaming and recording.
      SFU_RTC_MIN_PORT: "10000"
      SFU_RTC_MAX_PORT: "10099"
      SFU_INITIAL_OUTGOING_BITRATE: "25000000"
      SFU_MAX_INCOMING_BITRATE: "50000000"
      SFU_NUM_WORKERS: "1"
      SFU_RECORDINGS_DIR: "/recordings"
    volumes:
      - sfu-recordings:/recordings
      # Read-only access to API media directories so ffmpeg can open file-share sources.
      - api-videofiles:/app/VideoFiles:ro
      - api-temp:/app/Temp:ro
    ports:
      # HTTP API is NOT exposed outside the Docker network (intentionally).
      # The WebRtcServer port of each worker, UDP and TCP, is what browsers connect to. Add one per extra worker.
      - "10000:10000/udp"
      - "10000:10000/tcp"
    networks:
      - internal

  # ── SyncStreamAPI (.NET) ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      # The SFU service is reachable internally by its service name.
      SfuUrl: "http://sfu:3000"
    ports:
      - "5000:5000"
    volumes:
      - app-releases:/var/app-releases
      - sfu-recordings:/recordings:ro
      - api-videofiles:/app/VideoFiles
      - api-temp:/app/Temp
    depends_on:
      sfu:
        condition: service_healthy
    networks:
      - internal

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
